      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <!-- style.css -->
    <link href="product.css" rel="stylesheet" />

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap");
    </style>
  </head>

  <body>
    <div class="nav-container">
      <!-- bootstrap navbar -->
      <nav class="navbar navbar-expand-xl">
        <div class="nav-child container-fluid">
          <h3><a class="navbar-brand" href="#">SofaNest</a></h3>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a
                  class="nav-link active"
                  aria-current="page"
                  href="#"
                  style="
                    font-family: &quot;fraunces&quot;, sans-serif;
                    color: white;
                  "
                  >Home</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#arrivals">New Arrivals</a>
              </li>
              <li class="nav-item dropdown">
                <a
                  class="nav-link dropdown-toggle"
                  href="#"
                  role="button"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                >
                  Collections
                </a>
                <ul class="dropdown-menu">
                  <li>
                    <a class="dropdown-item" href="#collections">Interwood</a>
                  </li>
                  <li>
                    <a class="dropdown-item" href="#collections">Oxford</a>
                  </li>
                  <li>
                    <a class="dropdown-item" href="#collections">MoltyHome</a>
                  </li>
                  <li>
                    <a class="dropdown-item" href="#collections">Korean</a>
                  </li>
                </ul>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#about-us">About Us</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#our-story">Our Story</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#reviews">Reviews</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/contact.html">Contact</a>
              </li>
            </ul>
            <form class="d-flex" role="search">
              <input
                class="form-control me-2"
                type="search"
                placeholder="Search"
                aria-label="Search"
                id="nav-search"
              />
              <button class="btn" id="nav-search-btn">Search</button>
            </form>
          </div>
        </div>
      </nav>
      <!-- bootstrap navbar ends  -->
      <div class="cart-filter">
        <!-- bootstrap sidebar -->

        <a
          class="btn btn-primary filter-btn"
          data-bs-toggle="offcanvas"
          href="#offcanvasExample"
          role="button"
          aria-controls="offcanvasExample"
        >
          <i class="fa-solid fa-filter"></i>
          <span class="filter-para">Filter</span>
        </a>

        <div
          class="offcanvas offcanvas-start"
          tabindex="-1"
          id="offcanvasExample"
          aria-labelledby="offcanvasExampleLabel"
        >
          <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasExampleLabel">Filter</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="offcanvas"
              aria-label="Close"
            ></button>
          </div>
          <div class="offcanvas-body">
            <div class="dropdown mt-3">
              <button
                class="btn btn-secondary dropdown-toggle dropdown-btn"
                type="button"
                data-bs-toggle="dropdown"
              >
                Category
              </button>
              <ul class="dropdown-menu dropdown-menu2">
                <li><a class="dropdown-item" href="#">Interwood</a></li>
                <li><a class="dropdown-item" href="#">Oxford</a></li>
                <li><a class="dropdown-item" href="#">MoltyHome</a></li>
                <li><a class="dropdown-item" href="#">Korean</a></li>
              </ul>
            </div>
            <div class="dropdown mt-3">
              <button
                class="btn btn-secondary dropdown-toggle dropdown-btn"
                type="button"
                data-bs-toggle="dropdown"
              >
                Availability
              </button>
              <ul class="dropdown-menu dropdown-menu2">
                <li><a class="dropdown-item" href="#">In stock</a></li>
                <li><a class="dropdown-item" href="#">Out of stock</a></li>
              </ul>
            </div>
            <div class="dropdown mt-3 price-dropdown">
              <button
                class="btn btn-secondary dropdown-toggle dropdown-btn"
                type="button"
                data-bs-toggle="dropdown"
              >
                Price
              </button>
              <ul class="dropdown-menu dropdown-menu2">
                <li>
                  <div class="price-range">
                    <input
                      type="range"
                      class="form-range price-range-input price-range-min"
                      min="0"
                      max="100000"
                      step="10"
                      value="0"
                      aria-label="Minimum price"
                      id="form-range"
                    />
                    <input
                      type="range"
                      class="form-range price-range-input price-range-max"
                      min="0"
                      max="1000000"
                      step="10"
                      value="1000000"
                      aria-label="Maximum price"
                      id="form-range2"
                    />
                    <div class="price-range-values">
                      <div class="range1">
                        <span>Rs</span>
                        <span class="price-min" id="price-min">0</span>
                      </div>

                      <span class="to">to</span>
                      <div class="range2">
                        <span>Rs</span>
                        <span class="price-max" id="price-max">1000000</span>
                      </div>
                    </div>
                  </div>
                </li>
                <li class="price-apply-item">
                  <button type="button" class="price-apply-btn">Apply</button>
                </li>
              </ul>
            </div>
          </div>
        </div>

        <!-- bootstrap sidebar -->

        <div class="cart">
          <i class="fa-solid fa-cart-shopping"></i
          ><span class="cart-count">0</span>
        </div>
      </div>

    </div>
    <section class="card-container container-fluid">
      <div class="card" style="width: 19rem">
        <div class="card-body" id="card-body">
          <p class="card-title">Oxford</p>
          <button type="button" class="btn add-to-cart-btn">Add to cart</button>
        </div>
      </div>
    </section>

    <script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.js"></script>
    <script src="product.js"></script>
  </body>
</html>
