<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout</title>

    <!-- bootstrap CSS -->
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.css" />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <!-- style.css -->
    <link href="checkOut.css" rel="stylesheet" />

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Jost:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap");
    </style>
  </head>

  <body>
    <form action="checkout.php" method="post" class="checkout-container">
      <h2>Billing Address</h2>

      <div class="form-row">
        <label>Full Name</label>
        <input type="text" name="full_name" value="" />
      </div>

      <div class="form-row">
        <label>Phone Number</label>
        <input type="number" name="phone_number" value="" />
      </div>

      <div class="form-row">
        <label>Email Id</label>
        <input type="email" name="email" value="" />
      </div>

      <div class="form-group">
        <label>Flat, House no, Building, Company</label>
        <input type="text" name="address_line_1" value="" />
      </div>

      <div class="form-group">
        <label>Area, Street, Village</label>
        <input type="text" name="address_line_2" value="" />
      </div>

      <div class="form-group">
        <label>Landmark</label>
        <input type="text" name="landmark" value="" />
      </div>

      <div class="two-columns">
        <div class="form-group">
          <label>Pin Code</label>
          <input type="number" name="pin_code" value="" />
        </div>

        <div class="form-group">
          <label>City</label>
          <input type="text" name="city" value="" />
        </div>
      </div>

      <div class="two-columns">
        <div class="form-group">
          <label>State</label>
          <input type="text" name="state" value="" />
        </div>

        <div class="form-group">
          <label>Nation</label>
          <input type="text" name="nation" value="" />
        </div>
      </div>

      <div class="shipping-check">
        <input type="checkbox" id="shipping" name="shipping_same_as_billing" value="same_as_billing" />

        <label for="shipping"> Shipping address same as billing </label>
      </div>

      <button type="submit">Continue</button>

    </form>
    
  </body>
</html>
